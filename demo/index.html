<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../src/css/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>DotDash</title>
  </head>
  <body>
    <section>
      <h2>Avatar</h2>
      <div>
        <img src="https://i.pravatar.cc/40?u=avatar" alt="" is="avatar" />
        <icon name="person" is="avatar"></icon>
        <span is="avatar">BR</span>
      </div>
    </section>

    <section>
      <h2>Button</h2>
      <div>
        <button>Button</button>
        <button>
          <icon name="home"></icon>
          Home
        </button>
      </div>
    </section>

    <section>
      <h2>Checkbox</h2>
      <div>
        <fieldset>
          <input
            type="checkbox"
            name="checkbox"
            value="eggs"
            aria-label="Eggs"
          />
          <input
            type="checkbox"
            name="checkbox"
            value="milk"
            aria-label="Milk"
          />
          <input
            type="checkbox"
            name="checkbox"
            value="butter"
            aria-label="Butter"
          />
        </fieldset>
      </div>
    </section>

    <section>
      <h2>IconButton</h2>
      <div>
        <button is="icon-button">
          <icon name="menu"></icon>
        </button>
      </div>
    </section>

    <section>
      <h2>Icon</h2>
      <div>
        <icon name="person"></icon>
      </div>
    </section>

    <section>
      <h2>Radio</h2>
      <div>
        <fieldset>
          <input type="radio" name="radio" value="eggs" aria-label="Eggs" />
          <input type="radio" name="radio" value="milk" aria-label="Milk" />
          <input type="radio" name="radio" value="butter" aria-label="Butter" />
        </fieldset>
      </div>
    </section>

    <section>
      <h2>Select</h2>
      <div>
        <select name="" id="select" required>
          <option value="" disabled selected hidden>Select a fruit</option>
          <option value="apple">Apple</option>
          <option value="orange">Orange</option>
          <option value="pear">Pear</option>
          <option value="banana">Banana</option>
          <option value="peach">Peach</option>
          <option value="tangerine">Tangerine</option>
          <option value="pineapple">Pineapple</option>
          <option value="nectarine">Nectarine</option>
          <option value="grapes">Grapes</option>
          <option value="plum">Plum</option>
          <option value="mango">Mango</option>
          <option value="kiwi">Kiwi</option>
          <option value="melon">Melon</option>
          <option value="strawberries">Strawberries</option>
        </select>
      </div>
    </section>

    <section>
      <h2>Switch</h2>
      <div>...</div>
    </section>

    <section>
      <h2>Toggle</h2>
      <div>
        <button aria-pressed="false">
          <icon name="save" pressed="refresh"></icon>
          Save
        </button>
        <button is="icon-button" aria-pressed="false">
          <icon name="favorite"></icon>
        </button>
      </div>
    </section>

    <script>
      document.querySelectorAll("[aria-pressed]").forEach((button) => {
        button.addEventListener("click", () => {
          button.setAttribute(
            "aria-pressed",
            button.getAttribute("aria-pressed") === "true" ? "false" : "true",
          );
        });
      });
    </script>

    <style>
      @layer demo {
        body {
          font:
            400 1rem / 1.5 system-ui,
            sans-serif;
          margin: 0;
        }
        section {
          display: grid;
          gap: 0.5rem;
          padding: 1rem;

          & > h2 {
            margin: 0;
          }

          & > div {
            border: 1px dashed #ddd;
            padding: 1rem;
            display: grid;
            justify-items: start;
            gap: 0.5rem;
          }
        }
      }
    </style>

    <script src="../src/js/script.js"></script>
  </body>
</html>
