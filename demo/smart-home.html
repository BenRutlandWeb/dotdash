<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/css/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>Smart Home / DotDash</title>
  </head>
  <body>
    <button type="button" command="show-modal" commandfor="battery">
      <card>
        <div>
          <icon name="battery_5_bar"></icon>
          <div>
            <b>Pixel 9</b>
            <span>75%</span>
          </div>
        </div>
        <meter value="75"></meter>
      </card>
    </button>
    <dialog id="battery" closedby="any"></dialog>

    <style>
      card {
        display: inline-grid;
        padding: 0.5rem;
        border: 1px solid #eee;
        background-color: #f8f8f8;
        border-radius: 0.5rem;
        gap: 0.5rem;
        min-width: 200px;
        font:
          400 1rem / 1 system-ui,
          sans-serif;

        & > div {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;

          & div {
            display: grid;
            gap: 0.25rem;
          }
        }
      }
    </style>

    <script src="/src/js/script.js" type="module"></script>
  </body>
</html>
